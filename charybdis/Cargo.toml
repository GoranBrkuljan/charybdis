[package]
name = "charybdis"
rust-version = "1.94"
version = "1.1.0"
edition = "2024"
description = "High-Performance ORM for ScyllaDB"
repository = "https://github.com/goranbrkuljan/charybdis"
license = "MIT"
categories = ["database"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
charybdis-migrate = { version = "1.1.0", path = "../charybdis-migrate", optional = true }
charybdis_macros = { version = "1.1.0", path = "../charybdis-macros" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
scylla = { version = "1.10", features = ["full-serialization"] }
uuid = { version = "1.29.2", features = ["v1", "v4", "serde"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
colored = "3.1.1"
bigdecimal = { version = "0.4.11", features = ["serde"] }
num-bigint = "0.4.8"


[features]
migrate = ["charybdis-migrate"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
serde = "1.0"
serde_json = "1.0"

[lints]
workspace = true
