[package]
name = "charybdis_macros"
rust-version = "1.94"
version = "1.2.0"
edition = "2024"
description = "Proc macro crate for Charybdis ORM"
repository = "https://github.com/goranbrkuljan/charybdis"
license = "MIT"
categories = ["database"]

[lib]
proc-macro = true

[dependencies]
charybdis_parser = { version = "1.2.0", path = "../charybdis-parser" }
proc-macro2 = "1.0.107"
syn = { version = "3.0.10", features = ["full"] }
quote = "1.0.47"

[dev-dependencies]
charybdis = { path = "../charybdis" }
scylla = "1.10"
chrono = "0.4.45"

[lints]
workspace = true
