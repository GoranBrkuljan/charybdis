[package]
name = "charybdis-migrate"
rust-version = "1.94"
version = "1.1.0"
edition = "2024"
description = "Automatic Migration Tool for Charybdis ORM"
repository = "https://github.com/goranbrkuljan/charybdis"
license = "MIT"
categories = ["database"]

[dependencies]
charybdis_parser = { version = "1.1.0", path = "../charybdis-parser" }
scylla = { version = "1.10", features = ["openssl-010"] }
tokio = { version = "1.54.1", features = ["full"] }
colored = "3.1.1"
strip-ansi-escapes = "0.2.1"
clap = { version = "4.6.7", features = ["derive", "string"] }
regex = "1.13.1"
openssl = "0.10.82"
serde_json = "1.0.154"

[lib]
name = "migrate"
path = "src/lib.rs"

[[bin]]
name = "migrate"
path = "src/migrate.rs"

[lints]
workspace = true
