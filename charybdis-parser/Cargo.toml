[package]
name = "charybdis_parser"
rust-version = "1.94"
version = "1.2.0"
edition = "2024"
description = "Parser crate for Charybdis ORM"
repository = "https://github.com/goranbrkuljan/charybdis"
license = "MIT"
categories = ["database"]

[dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.10", features = ["full"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
scylla = "1.10"
serde_json = "1.0.154"
colored = "3.1.1"
walkdir = "2.5.0"
darling = "0.24.1"
strum = "0.28.0"
strum_macros = "0.28.0"

[lints]
workspace = true
