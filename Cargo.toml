[workspace]
resolver = "3"
members = [
    "charybdis-migrate",
    "charybdis",
    "charybdis-macros",
    "charybdis-parser",
    "examples/actix-web/reddit-api",
    "charybdis-bench",
]

[workspace.lints.clippy]
redundant_clone = "deny"
# Our error enums wrap the driver's error types, which are larger than clippy's threshold on their own.
# Boxing them would be a breaking change of the public API.
result_large_err = "allow"
